<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0; padding:0; background-color:#F4F5F7; font-family:'Inter', Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F4F5F7; padding:40px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(11,13,18,0.08);">
                    <!-- Brand header -->
                    <tr>
                        <td style="background-color:#0B0D12; padding:22px 32px;">
                            <table role="presentation" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="width:32px; height:32px; border-radius:8px; background-color:#8B7CF6; background-image:linear-gradient(135deg,#8B7CF6,#4EA8FF); text-align:center; vertical-align:middle; font-family:'Inter',Arial,sans-serif; font-weight:700; font-size:15px; color:#ffffff;">
                                        G
                                    </td>
                                    <td style="padding-left:10px; font-family:'Inter',Arial,sans-serif; font-size:15px; font-weight:600; color:#F4F5F7;">
                                        {{ app_name }}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- Content -->
                    <tr>
                        <td style="padding:36px 32px; color:#0B0D12;">
{% block content %}{% endblock %}
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#F4F5F7; padding:18px 32px; border-top:1px solid rgba(11,13,18,0.08);">
                            <p style="margin:0; font-family:'Inter',Arial,sans-serif; font-size:12px; color:rgba(11,13,18,0.45); text-align:center;">
                                &copy; {{ year }} {{ app_name }}
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
