<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Loading Gravit">
  <defs>
    <linearGradient id="lum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B7CF6"/>
      <stop offset="1" stop-color="#4EA8FF"/>
    </linearGradient>
  </defs>

  <!-- faint orbit guide -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#1C1F27" stroke-width="1.5"/>

  <!-- orbiting masses (Option B) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="1.4s" repeatCount="indefinite"/>
    <circle cx="60" cy="8" r="6" fill="#8B7CF6"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 60 60" to="480 60 60" dur="1.4s" repeatCount="indefinite"/>
    <circle cx="60" cy="8" r="4.5" fill="#6E8BF5" opacity="0.7"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="240 60 60" to="600 60 60" dur="1.4s" repeatCount="indefinite"/>
    <circle cx="60" cy="8" r="3.5" fill="#4EA8FF" opacity="0.45"/>
  </g>

  <!-- Gravit G mark at the center (the gravity well) -->
  <g transform="translate(60,63) scale(0.52)">
    <path d="M 36 -54 A 65 65 0 1 0 65 12 L 18 12" fill="none" stroke="url(#lum)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="58" cy="-66" r="10" fill="#4EA8FF"/>
  </g>
</svg>
